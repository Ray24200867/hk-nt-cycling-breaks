<!--
  嵌入範例 / Integration example
  給接手網頁的 AI：複製下面 <div> 這一段貼進目標網頁即可。
  iframe 會完全隔離樣式與腳本，最適合拼接到已有的資料新聞頁面。
  整個資料夾必須一起上傳（含 map-base.jpg 與 photos/）。
  如果資源放在別的目錄，把 src 改成該目錄下的 cycling-route-breakpoints.html 即可。
-->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>嵌入範例｜單車徑斷點路線圖</title>
  <style>
    body { margin: 0; background: #FAF8F5; }
    .embed-wrap { width: 100%; max-width: 1440px; margin: 0 auto; }
  </style>
</head>
<body>

<!-- ===== 複製這一段到你的網頁 ===== -->
<div class="embed-wrap" style="aspect-ratio: 1440 / 1520;">
  <iframe src="cycling-route-breakpoints.html"
          style="width:100%;height:100%;border:0;display:block"
          loading="lazy"
          title="一條2.2公里的單車徑，三度中斷｜實地騎車考察路線"></iframe>
</div>
<!-- ===== 複製結束 ===== -->

</body>
</html>
