<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="吳佳栩">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一條2.2公里的單車徑，三度中斷｜上水至粉嶺實地騎行路線</title>
  <style>
    :root {
      --cycle: #2B6CB0;
      --walk: #C4502A;
      --ink: #263238;
      --muted: #756F69;
      --paper: #FFFFFF;
      --leader: #8E8178;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0;  background: var(--paper); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
    }
    main { width: 100%; max-width: 1600px; margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; }
    .route-credit { margin: 8px 20px 16px; font-size: 13px; line-height: 1.6; text-align: right; color: var(--muted); }
    .title { font-size: 48px; font-weight: 720; letter-spacing: 1.4px; fill: var(--ink); }
    .subtitle { font-size: 17px; font-weight: 400; letter-spacing: 1px; fill: var(--muted); }
    .legend-text { font-size: 14px; font-weight: 550; fill: var(--ink); }
    .photo-label { font-size: 17px; font-weight: 700; letter-spacing: 1px; fill: var(--ink); }
    .photo-sub { font-size: 12px; font-weight: 500; fill: var(--muted); }
    .terminal-main { font-size: 18px; font-weight: 780; letter-spacing: 2px; fill: var(--ink); }
    .terminal-sub { font-size: 13px; font-weight: 500; letter-spacing: .5px; fill: var(--muted); }
    .photo-placeholder { font-size: 12px; font-weight: 550; letter-spacing: 1px; fill: #9B948D; }
    .photo-number { font-size: 15px; font-weight: 750; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
    .map-number { font-size: 14px; font-weight: 750; fill: var(--walk); text-anchor: middle; dominant-baseline: central; }
    .map-label { font-size: 13px; font-weight: 650; letter-spacing: .6px; fill: var(--ink); }
    .photo-connector { fill: none; stroke: var(--walk); stroke-width: 2.4; stroke-dasharray: 4 6; opacity: .9; }
    .photo-connector.stepped { stroke-linejoin: round; stroke-linecap: butt; }
    /* Hover linkage: a map marker enlarges its photo circle and draws a clay-red rim. */
    .node-disc { transform-box: fill-box; transform-origin: center; transition: transform .32s cubic-bezier(.22,.72,.28,1); }
    .photo-node.is-active .node-disc { transform: scale(1.14); }
    .node-ring { opacity: 0; transition: opacity .32s ease; }
    .photo-node.is-active .node-ring { opacity: 1; }
    .node-caption { transition: transform .32s cubic-bezier(.22,.72,.28,1); }
    .photo-node.is-active .node-caption { transform: translateY(16px); }
    #route-map [id^="breakpoint-"] { cursor: pointer; }
    .route-casing { fill: none; stroke: #FFFFFF; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; opacity: .94; }
    .route { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .cycle { stroke: var(--cycle); }
    .walk { stroke: var(--walk); }
    .base-map { filter: saturate(.48) contrast(.90) brightness(1.055); opacity: .80; }
    .photo-image { opacity: 0; transition: opacity .25s ease; }
    .photo-image.loaded { opacity: 1; }
    @media print {
      body { background: #FFFFFF; }
      main { max-width: none; }
      svg { width: 100%; }
    }
  </style>
</head>
<body>

  <!--
    Map section. The base map was cropped to its core area (250,110,1560x845),
    then this whole group is scaled by 1.2307692 so the frame keeps its original
    1340 x 725.8 size at (50, 510). Base map and route share this one transform,
    so their relative position cannot drift. The legend sits outside the group
    and keeps its original type size.
  -->
  <g id="map-section" transform="translate(-226.2821 -33.7179) scale(1.2307692)">
  <!-- Base map supplied by the user; no external map service is loaded. -->
  <g clip-path="url(#map-clip)">
    <image href="map-base.jpg" x="224.4792" y="441.7708" width="1088.75" height="589.7396" preserveAspectRatio="none" class="base-map"/>
    <rect x="224.4792" y="441.7708" width="1088.75" height="589.7396" fill="#FFFFFF" opacity=".10"/>
  </g>
  <rect x="224.4792" y="441.7708" width="1088.75" height="589.7396" rx="3" fill="none" stroke="#DDD7D0" stroke-width="1"/>

  <!--
    Route coordinates below are in the original 1080 x 649 map reference frame.
    Segment order: start-1 cycle; 1-2 walk; 2-3 cycle; 3-4 walk;
    4-5 cycle (former 4-5 plus 5-6 merged); 5-end walk (former 6-end).
    Former breakpoint 5 was a traffic-light junction, not a discontinuity.
    The walking loop and the actual V-shaped end are retained.
  -->
  <g id="route-map" transform="translate(50 365) scale(1.2407407407)">

<p class="route-credit">製圖：吳佳栩</p>
</main>
<script>
  // Add the five video stills at these relative paths; missing files keep the placeholders.
  const photoSources = [
    "photos/breakpoint-1.jpg",
    "photos/breakpoint-2.jpg",
    "photos/breakpoint-3.jpg",
    "photos/breakpoint-4.jpg",
    "photos/breakpoint-5.jpg"
  ];
  photoSources.forEach((source, index) => {
    const probe = new Image();
    probe.onload = () => {
      const target = document.getElementById(`photo-image-${index + 1}`);
      target.setAttribute("href", source);
      target.classList.add("loaded");
    };
    probe.src = source;
  });

  // Hover linkage: pointing at point N on the map enlarges photo circle N.
  const mapMarkers = document.querySelectorAll('#route-map [id^="breakpoint-"]');

  function setActive(index, on) {
    const node = document.getElementById(`photo-node-${index}`);
    if (node) node.classList.toggle("is-active", on);
  }

  mapMarkers.forEach((marker) => {
    const index = marker.id.replace("breakpoint-", "");
    marker.addEventListener("pointerenter", () => setActive(index, true));
    marker.addEventListener("pointerleave", () => setActive(index, false));
  });

</script>
<script>(()=>{let last=0;const send=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h>0&&Math.abs(h-last)>2){last=h;parent.postMessage({type:'cycling-component-size',height:h},location.origin)}};new ResizeObserver(send).observe(document.body);addEventListener('load',send);send()})()</script></body>
</html>
