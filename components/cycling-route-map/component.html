<!--
============================================================================
  元件：單車徑斷點路線圖 (cycling-route breakpoints map)
  給接手網頁的 AI —— 這是一個可直接嵌入的 HTML 片段，不是完整頁面。
  本檔案沒有 <html>/<head>/<body>，可直接 insertAdjacentHTML / 貼進模板 /
  放進 CMS 的 HTML block。所有 CSS 選擇器都以 #crm-root 為作用域，
  所有 SVG id 與 JS 全域變數都加了 crm- 前綴 / IIFE 包覆，不會污染宿主頁面。

  【用法 A｜最省事，零衝突】用 iframe 引入同包的完整頁面：
    <div style="width:100%;max-width:1440px;margin:0 auto;aspect-ratio:1440/1520">
      <iframe src="cycling-route-breakpoints.html"
              style="width:100%;height:100%;border:0" loading="lazy"
              title="單車徑斷點路線圖"></iframe>
    </div>
  可直接參考同資料夾的 embed.html。

  【用法 B｜插入 DOM】把本檔案全部內容直接放進目標網頁的容器中：
    <div id="my-section"></div>
    <script>fetch("component.html").then(r=>r.text()).then(h=>{
      document.getElementById("my-section").innerHTML = h;
    })</script>
  注意：innerHTML 注入的 <script> 不會執行，需改用 DOM 方式插入，
  或直接把 <script> 內容搬到宿主頁面上。用法 A 沒有這個限制。

  【資源依賴】7 個檔案，必須保持以下相對結構：
    map-base.jpg
    photos/breakpoint-1.jpg ... breakpoint-5.jpg
  若資源不在同目錄：只需改 <script> 裡的 ASSET_BASE 常數
  （例如 "/assets/route/" 或 CDN 前綴），圖片路徑會自動全部套用。
  缺少照片時該圓圈會自動顯示「現場照片」佔位，不會破圖。

  【尺寸】SVG viewBox = 0 0 1440 1520，寬度 100% 自適應、高度等比。
  外層容器建議 max-width: 1440px；不要設定固定 height，否則會變形。

  【互動】滑鼠移到地圖上的編號 1–5，對應照片圓圈放大 1.14 倍並
  出現 8px 赭紅 #C4502A 包邊；移開即復原。圓圈本身不響應 hover。

  【顏色 / 資料】單車徑 #2B6CB0、人行道 #C4502A、紙色 #FAF8F5。
  五個 WGS84 座標存在每個 #crm-breakpoint-N 的 data-lat / data-lon。
  全文為繁體中文；改文案請直接編輯 SVG 內的 <text>。

  【不要做】不要移除 #crm-root 包裝、不要去掉 id 的 crm- 前綴、
  不要把底圖換成需要 API key 的線上地圖（本圖使用使用者提供的靜態底圖，
  不含任何外部服務請求）。
============================================================================
-->
<style>
#crm-root {

#crm-root .terminal-main { font-size: 18px; font-weight: 780; letter-spacing: 2px; fill: var(--ink); }
#crm-root .terminal-sub { font-size: 13px; font-weight: 500; letter-spacing: .5px; fill: var(--muted); }
#crm-root .photo-placeholder { font-size: 12px; font-weight: 550; letter-spacing: 1px; fill: #9B948D; }
#crm-root .photo-number { font-size: 15px; font-weight: 750; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
#crm-root .map-number { font-size: 14px; font-weight: 750; fill: var(--walk); text-anchor: middle; dominant-baseline: central; }
#crm-root .map-label { font-size: 13px; font-weight: 650; letter-spacing: .6px; fill: var(--ink); }
#crm-root .photo-connector { fill: none; stroke: var(--walk); stroke-width: 2.4; stroke-dasharray: 4 6; opacity: .9; }

#crm-root .node-disc { transform-box: fill-box; transform-origin: center; transition: transform .32s cubic-bezier(.22,.72,.28,1); }
#crm-root .photo-node.is-active .node-disc { transform: scale(1.14); }
#crm-root .node-ring { opacity: 0; transition: opacity .32s ease; }
#crm-root .photo-node.is-active .node-ring { opacity: 1; }
#crm-root .node-caption { transition: transform .32s cubic-bezier(.22,.72,.28,1); }
#crm-root .photo-node.is-active .node-caption { transform: translateY(16px); }
#crm-root #crm-route-map [id^="crm-breakpoint-"] { cursor: pointer; }
#crm-root .route-casing { fill: none; stroke: #FFFFFF; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; opacity: .94; }
#crm-root .route { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
#crm-root .cycle { stroke: var(--cycle); }
#crm-root .walk { stroke: var(--walk); }
#crm-root .base-map { filter: saturate(.48) contrast(.90) brightness(1.055); opacity: .80; }
#crm-root .photo-image { opacity: 0; transition: opacity .25s ease; }
#crm-root .photo-image.loaded { opacity: 1; }
@media print {
  #crm-root { background: #FFFFFF; max-width: none; }
  #crm-root .crm-main { max-width: none; }
  #crm-root svg { width: 100%; }
}
</style>

<script>
(function () {
  // 只需要改這一個常數，就能把整個元件搬到任何目錄 / CDN。
  // 例如資源放在 https://example.com/story/ 時設為 "https://example.com/story/"
  var ASSET_BASE = "";

  var base = document.getElementById("crm-base-map");
  if (base) base.setAttribute("href", ASSET_BASE + "map-base.jpg");

  [1, 2, 3, 4, 5].forEach(function (i) {
    var src = ASSET_BASE + "photos/breakpoint-" + i + ".jpg";
    var probe = new Image();
    probe.onload = function () {
      var target = document.getElementById("crm-photo-image-" + i);
      if (!target) return;
      target.setAttribute("href", src);
      target.classList.add("loaded");
    };
    probe.src = src;
  });

  var markers = document.querySelectorAll('#crm-route-map [id^="crm-breakpoint-"]');
  function setActive(i, on) {
    var node = document.getElementById("crm-photo-node-" + i);
    if (node) node.classList.toggle("is-active", on);
  }
  markers.forEach(function (marker) {
    var i = marker.id.replace("crm-breakpoint-", "");
    marker.addEventListener("pointerenter", function () { setActive(i, true); });
    marker.addEventListener("pointerleave", function () { setActive(i, false); });
  });
})();
</script>
