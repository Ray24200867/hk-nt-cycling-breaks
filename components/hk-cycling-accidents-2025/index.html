:root{--cycle:#B5BAC1;--roadred:#D9453A;--bg:#F4EDDF;--paper:#FEF8ED;--ink:#49372F;--muted:#786457;--fatal:#8D4B3A;--serious:#DF7C61;--slight:#DDCBB5;--grid:#D9CBBA;--accent:#8D4B3A;--focus:#8D4B3A;--side:#8D4B3A;--top:#DF7C61}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 NotoTC,"PingFang HK",sans-serif;-webkit-font-smoothing:antialiased}
button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.graphic{max-width:1040px;margin:auto;padding:36px 40px 24px}header{position:relative}.edition{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;color:var(--muted);padding-bottom:18px;border-bottom:1px solid var(--grid)}.edition span:last-child{font-family:SourceSans,NotoTC,sans-serif;font-size:15px}
h1{font-size:32px;line-height:1.45;letter-spacing:-.025em;font-weight:700;margin:23px 0 12px;max-width:780px}p{margin:0}.subtitle{font-size:15px;color:var(--muted);max-width:740px;line-height:1.8}.instruction{margin-top:10px;font-size:12px;color:var(--muted)}

 const left=mobile?32:48,right=mobile?10:34,base=mobile?320:390,top=50,scale=(base-top)/1000;

 const categoryFill=key=>key==='fatal'?'url(#fatal-hatch)':css(key);
 svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width',W);svg.setAttribute('height',H);
 append(svg,'title',{id:'chart-title'},'按輕微、嚴重及致命事故分組比較單車徑與行車道路');
 append(svg,'desc',{id:'chart-desc'},'橫坐標依次為輕微、嚴重、致命，每組並排兩柱，分別為單車徑及行車道路。單車徑：輕微930宗、嚴重9宗、致命1宗；行車道路：輕微808宗、嚴重22宗、致命11宗。共用由零開始的0至1000宗線性刻度。');
 const defs=append(svg,'defs'),hatch=append(defs,'pattern',{id:'fatal-hatch',width:6,height:6,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'});append(hatch,'rect',{width:6,height:6,fill:css('fatal')});append(hatch,'line',{x1:0,y1:0,x2:0,y2:6,stroke:css('paper'),'stroke-width':2});
 text(svg,left-8,top-18,'宗','tick','end');
 for(const tick of [0,250,500,750,1000]){const y=base-tick*scale;append(svg,'line',{class:'shared-grid',x1:left,y1:y,x2:W-right,y2:y,stroke:css('grid'),'stroke-width':1});text(svg,left-9,y+4,String(tick),'num tick','end');}
 ['slight','serious','fatal'].forEach((key,j)=>{
  const center=left+(j+.5)*groupWidth;
  rows.forEach((r,i)=>{
   const cx=center+(i===0?-1:1)*(barW+gap)/2,x=cx-barW/2,h=r[key]*scale,y=base-h;
   const column=append(svg,'g',{'data-column':i,'data-category':key});
   const g=append(column,'g',{class:'segment grouped-bar'});target(g,i,key);
   append(g,'rect',{x,y,width:barW,height:h,fill:i===0?css('cycle'):css('roadred'),class:'front'});
   if(h>=14){
    const mark=append(column,'g',{class:'surface road-surface-mark','aria-hidden':'true'}),inset=Math.max(3,barW*.1);
    for(const edge of [x+inset,x+barW-inset])append(mark,'line',{x1:edge,y1:y+(h>=40?8:2),x2:edge,y2:base-2,stroke:css('paper'),'stroke-width':mobile?1.2:2});
    if(i===0&&h>=70){
     const ar=mobile?5:11,ay=y+24,flow=append(mark,'g',{class:'cycle-motion'});
     path(flow,`M${cx},${ay}l${ar},${ar}h${-ar*.65}v${ar*1.6}h${-ar*.7}v${-ar*1.6}h${-ar*.65}Z`,css('paper'));
     const fixed=append(mark,'g',{class:'stationary-bike'});bike(fixed,cx,y+h*.65,barW*.72);
     fixed.querySelector('g').setAttribute('stroke',css('ink'));
    }else if(i===1&&h>=24){
     append(mark,'line',{x1:cx,y1:y+12,x2:cx,y2:base-2,stroke:css('paper'),'stroke-width':mobile?1.2:2,'stroke-dasharray':'28 22',class:'moving-line'});
    }
   }
   text(g,cx,y-10,String(r[key]),'num grouped-value');
   append(g,'rect',{x:x-3,y:Math.min(y,base-26),width:barW+6,height:Math.max(26,h),fill:'transparent'});
  });
  text(svg,center,base+30,labels[key],'severity-name');
 });
}
let pinned=false,active=null,lastPoint=null;
function show(node,event){
 if(node.dataset.legend){showLegend(node,event);return;}
 const i=Number(node.dataset.road),key=node.dataset.key,r=rows[i],n=key==='combined'?r.fatal+r.serious:r[key];active=node;
 document.querySelectorAll('.legend-button').forEach(n=>n.classList.remove('is-active'));
 document.querySelectorAll('.segment,.data-row').forEach(n=>{const on=key==='total'||n.dataset.key===key||(key==='combined'&&['fatal','serious'].includes(n.dataset.key));n.classList.toggle('is-active',on);n.classList.toggle('is-dim',!on&&n.classList.contains('segment'));});
 document.querySelectorAll('[data-column]').forEach(n=>n.classList.toggle('road-active',n.dataset.column===String(i)));
 if(['fatal','serious','combined'].includes(key)){renderMagnifier(key);tip.classList.add('visible','is-magnified');position(node,event);return;}
 tip.classList.remove('is-magnified');
 tip.replaceChildren();const heading=document.createElement('div');heading.className='tip-heading';heading.textContent=r.name+'・'+labels[key];
 const number=document.createElement('div');number.className='tip-number';number.textContent=n;const unit=document.createElement('span');unit.textContent='宗';number.append(unit);
 const detail=document.createElement('div');detail.className='tip-calculation';
 if(key==='total')detail.textContent='輕微'+r.slight+'宗、嚴重'+r.serious+'宗、致命'+r.fatal+'宗';
 const end=document.createElement('div');end.className='tip-close';end.textContent=pinned?'再點一次、點空白處或按Esc關閉':'點按可固定詳情';tip.append(heading,number);if(key==='total')tip.append(detail);tip.append(end);tip.classList.add('visible');
 position(node,event);
}
function renderMagnifier(key){
 tip.replaceChildren();
 const heading=document.createElement('div');heading.className='tip-heading';heading.textContent=labels[key]+'事故｜放大比較';
 const note=document.createElement('div');note.className='tip-zoom-note';note.textContent='兩類道路共用0至40宗放大刻度';
 const detail=el('svg',{class:'tip-zoom',viewBox:'0 0 250 205',role:'img','aria-label':labels[key]+'事故：單車徑'+rows[0][key]+'宗、行車道路'+rows[1][key]+'宗；刻度0至40宗'});
 const base=172,scale=4;
 for(const tick of [0,10,20,30,40]){const y=base-tick*scale;append(detail,'line',{x1:33,y1:y,x2:238,y2:y,stroke:css('grid'),'stroke-width':1});text(detail,26,y+4,String(tick),'zoom-tick','end');}
 text(detail,26,8,'宗','zoom-tick','end');
 rows.forEach((r,i)=>{const cx=i===0?85:180,h=r[key]*scale;append(detail,'rect',{x:cx-20,y:base-h,width:40,height:h,fill:i===0?css('cycle'):css('roadred')});if(h>=14){for(const ex of [cx-15,cx+15])append(detail,'line',{x1:ex,y1:base-h+(h>=40?6:2),x2:ex,y2:base-2,stroke:css('paper'),'stroke-width':2});if(i===1&&h>=30)append(detail,'line',{x1:cx,y1:base-h+8,x2:cx,y2:base-2,stroke:css('paper'),'stroke-width':2,'stroke-dasharray':'12 9'});}text(detail,cx,base-h-8,String(r[key])+'宗','zoom-count');text(detail,cx,198,r.name,'zoom-count');});
 const end=document.createElement('div');end.className='tip-close';end.textContent=pinned?'再點一次、點空白處或按Esc關閉':'移出關閉；點按可固定詳情';tip.append(heading,note,detail,end);
}
function showLegend(node,event){
 tip.classList.remove('is-magnified');
 const key=node.dataset.legend;active=node;
 document.querySelectorAll('.segment').forEach(n=>{const on=n.dataset.key===key;n.classList.toggle('is-active',on);n.classList.toggle('is-dim',!on);});
 document.querySelectorAll('[data-column]').forEach(n=>n.classList.remove('road-active'));
 document.querySelectorAll('.legend-button').forEach(n=>n.classList.toggle('is-active',n===node));
 tip.replaceChildren();const heading=document.createElement('div');heading.className='tip-heading';heading.textContent=labels[key];tip.append(heading);
 rows.forEach(r=>{const line=document.createElement('div');line.className='tip-comparison';line.textContent=r.name+'：'+r[key]+'宗';tip.append(line);});
 const end=document.createElement('div');end.className='tip-close';end.textContent=pinned?'再點一次、點空白處或按Esc關閉':'點按可固定詳情';tip.append(end);tip.classList.add('visible');position(node,event);
}
function position(node,event){
 const b=node.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
 const pointer=event&&event.clientX!==undefined&&(event.clientX!==0||event.clientY!==0);
 let px=pointer?event.clientX:b.left+b.width/2,py=pointer?event.clientY:b.top;
 let x=px+18,y=py+18;
 if(x+tw>innerWidth-12)x=px-tw-18;
 if(y+th>innerHeight-12)y=py-th-14;
 tip.style.left=Math.max(12,Math.min(x,innerWidth-tw-12))+'px';tip.style.top=Math.max(12,Math.min(y,innerHeight-th-12))+'px';
}
function hide(){pinned=false;active=null;tip.classList.remove('visible','is-magnified');document.querySelectorAll('.is-active,.is-dim,.road-active').forEach(n=>n.classList.remove('is-active','is-dim','road-active'));}
document.addEventListener('pointerover',e=>{const n=e.target.closest('[data-road][data-key],[data-legend]');if(n&&!pinned&&e.pointerType!=='touch')show(n,e);});
document.addEventListener('pointermove',e=>{if(active&&!pinned&&e.pointerType!=='touch')position(active,e);});
document.addEventListener('pointerout',e=>{const n=e.target.closest('[data-road][data-key],[data-legend]');if(n&&!pinned&&!n.contains(e.relatedTarget))hide();});
document.addEventListener('focusin',e=>{const n=e.target.closest('[data-road][data-key],[data-legend]');if(n&&!pinned)show(n);});
document.addEventListener('focusout',e=>{if(!pinned)hide();});
document.addEventListener('click',e=>{const n=e.target.closest('[data-road][data-key],[data-legend]');if(!n){hide();return;}if(pinned&&active===n){hide();return;}pinned=true;show(n,e);});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide();if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg [data-road][data-key]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
const observer=new ResizeObserver(()=>{hide();paint();});observer.observe(svg.parentElement);
paint();document.fonts.ready.then(paint);
window.CHART_DATA=rows;
</script>
<script>(()=>{let last=0;const send=()=>{const h=Math.ceil(document.body.getBoundingClientRect().height);if(h>0&&Math.abs(h-last)>2){last=h;parent.postMessage({type:'cycling-component-size',height:h},location.origin)}};new ResizeObserver(send).observe(document.body);addEventListener('load',send);document.addEventListener('toggle',send,true);send()})()</script></body>
