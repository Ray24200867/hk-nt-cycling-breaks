 function layout(){
  const r=map.getBoundingClientRect();if(!r.width||!r.height)return;
  const pad=18;const list=sites.map(s=>({site:s,x:Math.max(pad,Math.min(r.width-pad,s.x/1100*r.width)),y:Math.max(pad,Math.min(r.height-pad,s.y/733*r.height))}));
  for(let round=0;round<40;round++){
   let moved=false;
   for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    let dx=list[j].x-list[i].x,dy=list[j].y-list[i].y;const gap=29;
    if(Math.abs(dx)<gap&&Math.abs(dy)<gap){
     if(Math.abs(dx)>Math.abs(dy)){const t=(gap-Math.abs(dx))/2+.1;const d=dx>=0?1:-1;list[i].x-=t*d;list[j].x+=t*d}
     else{const t=(gap-Math.abs(dy))/2+.1;const d=dy>=0?1:-1;list[i].y-=t*d;list[j].y+=t*d}moved=true;
    }
   }
   list.forEach(p=>{p.x=Math.max(pad,Math.min(r.width-pad,p.x));p.y=Math.max(pad,Math.min(r.height-pad,p.y))});if(!moved)break;
  }
  const unit=1100/r.width;positions=list;
  nodes.forEach((n,i)=>{
   const p=list[i],x=p.x/r.width*1100,y=p.y/r.height*733,rad=11*unit;
   n.leader.setAttribute('x1',n.site.x);n.leader.setAttribute('y1',n.site.y);n.leader.setAttribute('x2',x);n.leader.setAttribute('y2',y);
   n.anchor.setAttribute('cx',n.site.x);n.anchor.setAttribute('cy',n.site.y);n.anchor.setAttribute('r',2*unit);
   n.position.setAttribute('transform',`translate(${x} ${y})`);
   if(n.site.kind==='parking'){n.shape.setAttribute('cx',0);n.shape.setAttribute('cy',0);n.shape.setAttribute('r',rad)}
   else{n.shape.setAttribute('x',-rad);n.shape.setAttribute('y',-rad);n.shape.setAttribute('width',rad*2);n.shape.setAttribute('height',rad*2);n.shape.setAttribute('rx',2*unit)}
   n.text.setAttribute('x',0);n.text.setAttribute('y',0);n.text.setAttribute('font-size',(n.site.kind==='rail'?8:13)*unit);
  });
 }
 function paint(){
  const active=hover||pinned||'all',id=hover?hoverId:pinnedId;
  root.dataset.active=active;
  choices.forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.kind===pinned));b.classList.toggle('is-preview',b.dataset.kind===active)});
  nodes.forEach(n=>n.group.classList.toggle('is-hot',n.site.kind===active&&(!id||n.site.id===id)));
  const place=sites.find(s=>s.id===id);

 function hit(ev){
  const r=map.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;
  let nearest=null,d=18;positions.forEach(p=>{const q=Math.hypot(x-p.x,y-p.y);if(q<d){d=q;nearest=p.site}});
  if(nearest)return {kind:nearest.kind,id:nearest.id,x,y};
  const xx=Math.floor(x/r.width*1100),yy=Math.floor(y/r.height*733);
  if(alpha(cyclePixels,xx,yy))return {kind:'cycle',id:null,x,y};
  if(alpha(homePixels,xx,yy))return {kind:'home',id:null,x,y};
  return {kind:null,id:null,x,y};
 }

 function restore(s){const p=s?.privateContent;if(p?.overviewVersion===1&&Object.hasOwn(labels,p.pinned)){pinned=p.pinned;pinnedId=sites.some(t=>t.id===p.pinnedId)?p.pinnedId:null}else{pinned=null;pinnedId=null}hover=null;hoverId=null;paint()}
 restore(window.openai?.widgetState);layout();new ResizeObserver(layout).observe(map);
 window.addEventListener('openai:set_globals',ev=>{if(ev.detail?.globals?.widgetState)restore(ev.detail.globals.widgetState)});
})();
